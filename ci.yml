name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify server.js syntax
        run: node --check server.js

      - name: Check dist output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          echo "Build output verified ✓"
